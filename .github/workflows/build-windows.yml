name: Build Windows Desktop GUI (.exe)

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach Windows zip (optional)"
        required: false
        default: ""

jobs:
  build-windows-exe:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Set up Python 3.12 and dependencies
        shell: pwsh
        run: |
          uv python install 3.12
          uv venv --python 3.12 .venv-win
          uv pip install --python .venv-win --no-cache ".[gui,ai,tls]" pyinstaller

      - name: Build standalone Windows GUI with PyInstaller
        shell: pwsh
        run: |
          .venv-win\Scripts\pyinstaller.exe --noconfirm WBSDK_Pro.spec
          if (-not (Test-Path "dist/WBSDK_Pro/WBSDK_Pro.exe")) { throw "Missing WBSDK_Pro.exe" }
          Compress-Archive -Path "dist/WBSDK_Pro/*" -DestinationPath "dist/WBSDK_Pro_Windows_x64.zip" -Force
          Get-Item "dist/WBSDK_Pro_Windows_x64.zip" | Select-Object Name, Length

      - name: Upload Windows GUI zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-gui-exe
          path: dist/WBSDK_Pro_Windows_x64.zip

      - name: Attach Windows GUI zip to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
          files: dist/WBSDK_Pro_Windows_x64.zip
