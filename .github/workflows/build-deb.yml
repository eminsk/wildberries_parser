name: Build Debian Package (.deb)

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-deb:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Debian build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper dh-python pybuild-plugin-pyproject python3-all python3-hatchling python3-wheel dpkg-dev

      - name: Build binary .deb package
        run: |
          chmod +x debian/rules
          dpkg-buildpackage -us -uc -b -d
          ls -la ../*.deb
          mkdir -p dist-deb
          cp ../*.deb dist-deb/
          dpkg-deb --info dist-deb/*.deb
          dpkg-deb --contents dist-deb/*.deb

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: dist-deb/*.deb

      - name: Attach .deb to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist-deb/*.deb
