name: Multi-Python CI (3.8-3.16, PyPy, No-GIL)

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  test-matrix:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental || false }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version:
          - "3.8"
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"
          - "3.13t"
          - "3.14t"
          - "3.15t"
          - "pypy3.9"
          - "pypy3.10"
          - "pypy3.11"
          - "pypy3.12"
        include:
          - os: ubuntu-latest
            python-version: "pypy3.8"
          - os: ubuntu-latest
            python-version: "3.16"
            experimental: true
          - os: ubuntu-latest
            python-version: "3.16t"
            experimental: true
          - os: windows-latest
            python-version: "3.16"
            experimental: true
          - os: windows-latest
            python-version: "3.16t"
            experimental: true
        exclude:
          # PyPy 3.11/3.12 on macOS runners may not always be mirrored via uv
          - os: macos-latest
            python-version: "pypy3.12"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Run pytest on Python ${{ matrix.python-version }}
        run: |
          uv run --isolated --python ${{ matrix.python-version }} --with pytest pytest -v
          uv run --isolated --python ${{ matrix.python-version }} python -c "import sys, wb_parser; print('wb_parser', wb_parser.__version__, 'py:', sys.version.split()[0], 'gil:', getattr(sys, '_is_gil_enabled', lambda: True)())"
