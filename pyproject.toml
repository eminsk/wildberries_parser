[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wb-parser-sdk"
version = "2.0.0"
description = "High-performance Wildberries SDK & Desktop GUI: dynamic basket-01..65+ sharding, feedbacks1/2 routing, Chrome TLS fingerprinting, async scraping, MCP server, and Excel export"
readme = "README.md"
authors = [
    { name = "eminsk", email = "M_N_Nik@yahoo.com" },
]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = [
    "wildberries",
    "wb",
    "parser",
    "scraper",
    "sdk",
    "e-commerce",
    "marketplace",
    "mcp",
    "customtkinter",
    "price-tracker",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "curl-cffi>=0.7.0",
    "customtkinter>=5.2.0",
    "httpx[http2]>=0.27.0",
    "openpyxl>=3.1.0",
    "pillow>=10.0.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dataframe = [
    "pandas>=2.0.0",
]
all = [
    "pandas>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
wb-parser = "wb_parser.cli:main"
wb-sdk = "wb_parser.cli:main"
wb-gui = "wb_parser.gui:main_gui"
wb-mcp = "wb_parser.mcp_server:main_mcp"

[project.urls]
Homepage = "https://github.com/eminsk/wildberries_parser"
Repository = "https://github.com/eminsk/wildberries_parser"
Issues = "https://github.com/eminsk/wildberries_parser/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/wb_parser"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.venv*",
    "/_local_drafts*",
    "/dist*",
    "/build*",
    "/storage*",
    "/result*",
    "/*.db",
    "/*.xlsx",
    "/*.csv",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"
